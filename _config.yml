# GitHub Pages 가 빌드할 때 읽는 설정. 로컬 설치 불필요.
title: 김동규
description: 초분광 영상 AI 연구원
lang: ko

# 테마는 이 한 줄로 바꾼다. 예: pages-themes/cayman, pages-themes/architect, pages-themes/hacker
remote_theme: pages-themes/minimal@v0.2.0
plugins:
  - jekyll-remote-theme

# 미리보기 산출물과 메모는 빌드에서 제외
exclude:
  - README.md
  - _site-preview/
